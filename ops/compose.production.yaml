services:
  wordpress:
    environment:
      PILLOWAY_HOME: https://pilloway.eu
      WP_ENVIRONMENT_TYPE: production
      WORDPRESS_DEBUG: "0"
      PILLOWAY_META_CAPI_TOKEN: ${PILLOWAY_META_CAPI_TOKEN:-}
      WORDPRESS_AUTH_KEY: ${WORDPRESS_AUTH_KEY:?Set a unique WordPress AUTH_KEY}
      WORDPRESS_SECURE_AUTH_KEY: ${WORDPRESS_SECURE_AUTH_KEY:?Set a unique WordPress SECURE_AUTH_KEY}
      WORDPRESS_LOGGED_IN_KEY: ${WORDPRESS_LOGGED_IN_KEY:?Set a unique WordPress LOGGED_IN_KEY}
      WORDPRESS_NONCE_KEY: ${WORDPRESS_NONCE_KEY:?Set a unique WordPress NONCE_KEY}
      WORDPRESS_AUTH_SALT: ${WORDPRESS_AUTH_SALT:?Set a unique WordPress AUTH_SALT}
      WORDPRESS_SECURE_AUTH_SALT: ${WORDPRESS_SECURE_AUTH_SALT:?Set a unique WordPress SECURE_AUTH_SALT}
      WORDPRESS_LOGGED_IN_SALT: ${WORDPRESS_LOGGED_IN_SALT:?Set a unique WordPress LOGGED_IN_SALT}
      WORDPRESS_NONCE_SALT: ${WORDPRESS_NONCE_SALT:?Set a unique WordPress NONCE_SALT}
